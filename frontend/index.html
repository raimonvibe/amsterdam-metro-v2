      <h1>Metro Amsterdam Live — live 3D-metrokaart van Amsterdam</h1>
      <p>
        Check live waar elke metro in Amsterdam nu rijdt. Deze live 3D metro map toont alle
        GVB-metrolijnen (M50, M51, M52, M53 en M54) op hun echte sporen, met vertragingen en
        vertrektijden per station. De kaart heeft JavaScript en WebGL nodig.
      </p>
      <p>
        De metro's rijden over de echte bochten van het spoor, tussen 3D-gebouwen. Klik op een
        station voor de volgende vertrekken, of op een metro om hem te volgen met de volgende halte,
        vertraging, aankomsttijd en het perron. Storingsberichten van GVB voor de metro staan op de
        kaart, in het Nederlands of Engels. De Amsterdamse metro deelt geen GPS-posities: de plek
        van elke metro wordt berekend uit de live dienstregeling en vertragingen van GVB.
      </p>
