<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Metro Amsterdam Live — 3D metrokaart &amp; metro map | GVB M50–M54</title>
    <meta
      name="description"
      content="Check live waar elke metro in Amsterdam nu rijdt. Live 3D-metrokaart van GVB-lijnen M50, M51, M52, M53 en M54 met vertragingen en vertrektijden per station."
    />
    <meta
      name="keywords"
      content="Amsterdam metro, GVB metro, live metrokaart, metro Amsterdam live, M50, M51, M52, M53, M54, metro vertrektijden, OV Amsterdam"
    />
    <meta name="author" content="raimonvibe" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Updated at runtime to the chosen map style; default style (Liberty) is light. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/social-share.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://amsterdammetro.nl/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Start the slow parts while the JS bundle downloads: connections to the
         tile and API hosts, and the static map data (~280 KB gzipped) the app
         needs before it can draw anything. crossorigin matches fetch()'s CORS
         mode so the app's own requests reuse these responses. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preload" as="fetch" href="%VITE_API_URL%/api/shapes" crossorigin />
    <link rel="preload" as="fetch" href="%VITE_API_URL%/api/lines" crossorigin />
    <link rel="preload" as="fetch" href="%VITE_API_URL%/api/stations" crossorigin />
