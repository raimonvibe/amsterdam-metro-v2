# NOTE: the production services were created in the Render dashboard, not
# from this Blueprint, so Render does not read this file. It documents the
# intended settings; apply changes in the dashboard (see
# docs/render-deploy-plan.md, "Deploy files").
services:
  - type: web
    name: amsterdam-metro-api
    runtime: python
    plan: starter
    rootDir: backend
    # requirements.txt pins every package (audit M3); ranges are in requirements.in.
    buildCommand: pip install -r requirements.txt
    # No per-request access log: on a 0.5-CPU instance formatting those lines
    # is measurable overhead. --timeout-graceful-shutdown: uvicorn otherwise
    # waits on every open /api/trains/stream connection before exiting, so a
    # deploy would hang until Render kills the old instance; after 5s the
    # streams are cut and browsers reconnect to the new instance.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --timeout-graceful-shutdown 5
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: CORS_ORIGINS
        value: "https://amsterdammetro.nl,https://www.amsterdammetro.nl"

  - type: web
    name: amsterdam-metro
    runtime: static
    rootDir: frontend
    # npm ci installs exactly package-lock.json, as CI does; npm install could
    # resolve newer versions than were tested (audit M3).
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://api.amsterdammetro.nl"
    routes:
      # The build writes reisinfo/index.html and privacy/index.html with
      # their own title, description and canonical. These two must come
      # before the catch-all, or crawlers get the homepage's head there.
      - type: rewrite
        source: /reisinfo
        destination: /reisinfo/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything under /assets, so a file there never
      # changes: repeat visits skip the ~2MB bundle entirely.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The entry page (served at / and the /privacy and /reisinfo SPA routes) must revalidate
      # so a deploy is picked up immediately.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /privacy
        name: Cache-Control
        value: no-cache
      - path: /reisinfo
        name: Cache-Control
        value: no-cache
      # Security headers (audit M1). Generated from frontend/src/securityHeaders.ts;
      # securityHeaders.test.ts fails if these drift apart. Render does not read
      # this file: set the same values in the dashboard (Settings > Headers).
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://api.amsterdammetro.nl https://tiles.openfreemap.org data:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
