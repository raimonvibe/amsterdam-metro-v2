services:
  - type: web
    name: amsterdam-metro-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # No per-request access log: every viewer polls every few seconds, and on a
    # 0.5-CPU instance formatting those lines is measurable overhead.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        value: "https://amsterdammetro.nl,https://www.amsterdammetro.nl"

  - type: web
    name: amsterdam-metro
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://api.amsterdammetro.nl"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything under /assets, so a file there never
      # changes: repeat visits skip the ~2MB bundle entirely.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The entry page (served at / and the /privacy SPA route) must revalidate
      # so a deploy is picked up immediately.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /privacy
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
